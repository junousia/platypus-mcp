name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate publishing without uploading.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NPM_RELEASE_PLATFORMS: linux-x64,linux-arm64,darwin-x64,darwin-arm64

jobs:
  npm-package:
    name: Build and validate npm package binary
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runs_on: ubuntu-latest
            cargo_target: ""
            binary_path: target/release/platypus-mcp
          - platform: linux-arm64
            runs_on: ubuntu-24.04-arm
            cargo_target: ""
            binary_path: target/release/platypus-mcp
          - platform: darwin-x64
            runs_on: macos-15-intel
            cargo_target: ""
            binary_path: target/release/platypus-mcp
          - platform: darwin-arm64
            runs_on: macos-15
            cargo_target: aarch64-apple-darwin
            binary_path: target/aarch64-apple-darwin/release/platypus-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Node version
        run: |
          node --version
          npm --version

      - name: Show Rust version
        run: |
          rustc --version
          cargo --version

      - name: Build npm binary
        run: |
          if [ -n "${{ matrix.cargo_target }}" ]; then
            rustup target add "${{ matrix.cargo_target }}"
            cargo build --release --target "${{ matrix.cargo_target }}"
          else
            cargo build --release
          fi
          mkdir -p "vendor/${{ matrix.platform }}"
          cp "${{ matrix.binary_path }}" "vendor/${{ matrix.platform }}/platypus-mcp"
          chmod 755 "vendor/${{ matrix.platform }}/platypus-mcp"

      - name: Validate npm package contents
        env:
          PLATYPUS_NPM_REQUIRE_BINARY: "1"
          PLATYPUS_NPM_REQUIRED_PLATFORMS: ${{ matrix.platform }}
        run: make npm-package

      - name: Upload npm binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: platypus-mcp-${{ matrix.platform }}
          path: vendor/${{ matrix.platform }}/platypus-mcp
          if-no-files-found: error
          retention-days: 7

  crates-io:
    name: Publish crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Ensure rustfmt is installed
        run: rustup component add rustfmt

      - name: Verify
        run: make check

      - name: Validate package
        run: make publish-dry-run

      - name: Publish to crates.io
        if: github.event_name == 'release' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for publishing." >&2
            exit 2
          fi
          set +e
          make publish > /tmp/cargo-publish.out 2> /tmp/cargo-publish.err
          code="$?"
          set -e
          cat /tmp/cargo-publish.out
          cat /tmp/cargo-publish.err >&2
          if [ "${code}" -eq 0 ]; then
            exit 0
          fi
          if grep -Eiq 'already exists|previously uploaded' /tmp/cargo-publish.out /tmp/cargo-publish.err; then
            echo "Crate version already exists on crates.io; treating publish as complete for rerun idempotency."
            exit 0
          fi
          exit "${code}"

  npm-publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs:
      - npm-package
      - crates-io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Node version
        run: |
          node --version
          npm --version

      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org

      - name: Download npm binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: platypus-mcp-*
          path: .platy/npm-artifacts

      - name: Stage npm package binaries
        run: |
          for platform in $(echo "${NPM_RELEASE_PLATFORMS}" | tr ',' ' '); do
            source=".platy/npm-artifacts/platypus-mcp-${platform}/platypus-mcp"
            target="vendor/${platform}/platypus-mcp"
            if [ ! -f "${source}" ]; then
              echo "Missing npm binary artifact for ${platform}: ${source}" >&2
              exit 2
            fi
            mkdir -p "vendor/${platform}"
            cp "${source}" "${target}"
            chmod 755 "${target}"
          done

      - name: Validate combined npm package
        env:
          PLATYPUS_NPM_REQUIRE_BINARY: "1"
          PLATYPUS_NPM_REQUIRED_PLATFORMS: ${{ env.NPM_RELEASE_PLATFORMS }}
        run: make npm-package

      - name: Validate npm publish
        env:
          PLATYPUS_NPM_REQUIRE_BINARY: "1"
          PLATYPUS_NPM_REQUIRED_PLATFORMS: ${{ env.NPM_RELEASE_PLATFORMS }}
        run: make npm-publish-dry-run

      - name: Check npm package version
        id: npm-version
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version --registry https://registry.npmjs.org >/tmp/npm-version.txt 2>/tmp/npm-version.err; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "${package_name} ${package_version} already exists on npm; skipping upload."
          elif grep -Eq 'E404|404 Not Found|No match found' /tmp/npm-version.err; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            echo "${package_name} ${package_version} is not published yet."
          else
            echo "Could not determine npm publish state for ${package_name} ${package_version}." >&2
            cat /tmp/npm-version.err >&2
            exit 2
          fi

      - name: Publish to npm
        if: (github.event_name == 'release' || inputs.dry_run == false) && steps.npm-version.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PLATYPUS_NPM_REQUIRE_BINARY: "1"
          PLATYPUS_NPM_REQUIRED_PLATFORMS: ${{ env.NPM_RELEASE_PLATFORMS }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is required for npm publishing." >&2
            exit 2
          fi
          make npm-publish

      - name: Skip npm publish
        if: (github.event_name == 'release' || inputs.dry_run == false) && steps.npm-version.outputs.published == 'true'
        run: echo "npm package version already exists; treating publish as complete for rerun idempotency."
