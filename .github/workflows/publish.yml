name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to validate or publish. Defaults to package.json on dry runs.
        required: false
        type: string
      dry_run:
        description: Validate publishing without uploading.
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_RELEASE_PLATFORMS: linux-x64,linux-arm64,darwin-x64,darwin-arm64

jobs:
  release-meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            raw="${GITHUB_REF_NAME}"
            publish=true
          else
            raw="${{ inputs.version }}"
            publish="${{ inputs.dry_run == false }}"
          fi
          if [ -z "${raw}" ]; then
            raw="$(node -p "require('./package.json').version")"
          fi
          version="${raw#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${raw}" >&2
            exit 2
          fi
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  npm-package:
    name: Build npm binary (${{ matrix.platform }})
    runs-on: ${{ matrix.runs_on }}
    needs: release-meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runs_on: ubuntu-latest
          - platform: linux-arm64
            runs_on: ubuntu-24.04-arm
          - platform: darwin-x64
            runs_on: macos-15-intel
          - platform: darwin-arm64
            runs_on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.platform }}
          repository-cache: true

      - name: Build release binary
        env:
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
        run: bazel build --config=release //:platypus-mcp

      - name: Stage package-local binary
        run: |
          mkdir -p "vendor/${{ matrix.platform }}"
          cp bazel-bin/platypus-mcp "vendor/${{ matrix.platform }}/platypus-mcp"
          chmod 755 "vendor/${{ matrix.platform }}/platypus-mcp"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org

      - name: Validate npm package contents
        env:
          PLATYPUS_NPM_REQUIRE_BINARY: "1"
          PLATYPUS_NPM_REQUIRED_PLATFORMS: ${{ matrix.platform }}
        run: npm run package:validate

      - name: Upload npm binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: platypus-mcp-${{ matrix.platform }}
          path: vendor/${{ matrix.platform }}/platypus-mcp
          if-no-files-found: error
          retention-days: 7

  crates-io:
    name: Publish crate
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-crate
          repository-cache: true

      - name: Test
        run: bazel test //...

      - name: Build stamped crate metadata
        env:
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
        run: bazel build --config=release //:release_cargo_toml //:release_cargo_lock

      - name: Apply stamped crate metadata
        run: |
          cp bazel-bin/release/Cargo.toml Cargo.toml
          cp bazel-bin/release/Cargo.lock Cargo.lock

      - name: Validate package
        run: cargo publish --dry-run --allow-dirty

      - name: Publish to crates.io
        if: needs.release-meta.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for publishing." >&2
            exit 2
          fi
          set +e
          cargo publish --allow-dirty > /tmp/cargo-publish.out 2> /tmp/cargo-publish.err
          code="$?"
          set -e
          cat /tmp/cargo-publish.out
          cat /tmp/cargo-publish.err >&2
          if [ "${code}" -eq 0 ]; then
            exit 0
          fi
          if grep -Eiq 'already exists|previously uploaded' /tmp/cargo-publish.out /tmp/cargo-publish.err; then
            echo "Crate version already exists on crates.io; treating publish as complete for rerun idempotency."
            exit 0
          fi
          exit "${code}"

  npm-publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - npm-package
      - crates-io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-npm
          repository-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org

      - name: Build stamped npm metadata
        env:
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
        run: bazel build --config=release //:release_package_json

      - name: Apply stamped npm metadata
        run: cp bazel-bin/release/package.json package.json

      - name: Download npm binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: platypus-mcp-*
          path: .platy/npm-artifacts

      - name: Stage npm package binaries
        run: |
          for platform in $(echo "${NPM_RELEASE_PLATFORMS}" | tr ',' ' '); do
            source=".platy/npm-artifacts/platypus-mcp-${platform}/platypus-mcp"
            target="vendor/${platform}/platypus-mcp"
            if [ ! -f "${source}" ]; then
              echo "Missing npm binary artifact for ${platform}: ${source}" >&2
              exit 2
            fi
            mkdir -p "vendor/${platform}"
            cp "${source}" "${target}"
            chmod 755 "${target}"
          done

      - name: Validate combined npm package
        env:
          PLATYPUS_NPM_REQUIRE_BINARY: "1"
          PLATYPUS_NPM_REQUIRED_PLATFORMS: ${{ env.NPM_RELEASE_PLATFORMS }}
        run: npm run package:validate

      - name: Validate npm publish
        env:
          PLATYPUS_NPM_REQUIRE_BINARY: "1"
          PLATYPUS_NPM_REQUIRED_PLATFORMS: ${{ env.NPM_RELEASE_PLATFORMS }}
        run: npm run publish:dry-run

      - name: Check npm package version
        id: npm-version
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version --registry https://registry.npmjs.org >/tmp/npm-version.txt 2>/tmp/npm-version.err; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "${package_name} ${package_version} already exists on npm; skipping upload."
          elif grep -Eq 'E404|404 Not Found|No match found' /tmp/npm-version.err; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            echo "${package_name} ${package_version} is not published yet."
          else
            echo "Could not determine npm publish state for ${package_name} ${package_version}." >&2
            cat /tmp/npm-version.err >&2
            exit 2
          fi

      - name: Publish to npm
        if: needs.release-meta.outputs.publish == 'true' && steps.npm-version.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PLATYPUS_NPM_REQUIRE_BINARY: "1"
          PLATYPUS_NPM_REQUIRED_PLATFORMS: ${{ env.NPM_RELEASE_PLATFORMS }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is required for npm publishing." >&2
            exit 2
          fi
          npm run publish:release

      - name: Skip npm publish
        if: needs.release-meta.outputs.publish == 'true' && steps.npm-version.outputs.published == 'true'
        run: echo "npm package version already exists; treating publish as complete for rerun idempotency."

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - npm-publish
    if: github.event_name == 'push' && needs.release-meta.outputs.publish == 'true'
    steps:
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-meta.outputs.version }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "platypus-mcp ${RELEASE_VERSION}" \
              --latest
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "platypus-mcp ${RELEASE_VERSION}" \
              --generate-notes \
              --latest
          fi
