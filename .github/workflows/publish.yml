name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate publishing without uploading.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-crate
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    name: Publish crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Ensure rustfmt is installed
        run: rustup component add rustfmt

      - name: Verify
        run: make check

      - name: Validate package
        run: make publish-dry-run

      - name: Publish to crates.io
        if: github.event_name == 'release' || inputs.dry_run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for publishing." >&2
            exit 2
          fi
          make publish
