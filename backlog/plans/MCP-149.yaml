item_id: MCP-149
version: 1
mode: standard
requirements:
- id: R1
  text: Worker handoff and completion guidance makes formatting verification expectations explicit before integration.
- id: R2
  text: Integration or review guidance flags formatting-sensitive changes before final manager-workspace integration where practical.
- id: R3
  text: MCP tools do not run arbitrary formatter commands automatically.
design:
  summary: Prefer guidance and verification-contract changes over tool-side command execution. Update worker bundle/completion/integration guidance so formatting checks happen in worker verification before integration, reducing manager cleanup commits.
  owned_surfaces:
  - src/workspace.rs
  - src/dispatch.rs
  - src/host_lifecycle.rs
  - docs/workflow.md
  - tests
  notes: null
tasks:
