item_id: MCP-039
version: 1
mode: standard
requirements:
- id: R1
  text: A host-style test drives the public MCP tool surface from setup through execution and report drafting.
- id: R2
  text: The exercise uses local fixtures and fake workers/providers only.
- id: R3
  text: Skipped and failed paths in the exercise include actionable structured recovery guidance.
design:
  summary: Extend stdio protocol coverage with a product exercise that imports external work, dispatches it to a fake worker, records verification/integration, reconciles, drafts a report, and records an approved dispatch result.
  owned_surfaces:
  - tests/stdio_protocol.rs
  - docs/workflow.md
  - docs/tools.md
  notes: Reuse the existing stdio test harness and fake worktree flow.
tasks:
