[package]
name = "platypus-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first MCP server for deterministic Platypus project orchestration"
repository = "https://github.com/junousia/platypus-mcp"
homepage = "https://github.com/junousia/platypus-mcp"
readme = "README.md"
keywords = ["mcp", "agent", "orchestration", "automation"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    ".agents/",
    ".codex/",
    ".platy/",
    "/AGENTS.md",
    "/WORKFLOW.md",
    "/backlog/",
    "/platy.yaml",
    "target/",
]

[dependencies]
anyhow = "1.0"
rmcp = { version = "0.16.0", features = ["client", "server", "transport-child-process", "transport-io"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
schemars = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3.23.0"
