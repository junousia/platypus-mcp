[package]
name = "platypus-mcp-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
rmcp = { version = "0.16.0", features = ["client", "server", "transport-child-process", "transport-io"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
schemars = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3.23.0"
